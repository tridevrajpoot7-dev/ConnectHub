<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - ConnectHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="signup-page">

    <div class="signup-card">

        <a href="login.html" class="back-link">
            ← Back to Login
        </a>

        <h1>Reset Password 🔐</h1>

        <p class="signup-subtitle">
            Create a new password for your ConnectHub account.
        </p>

        <form id="resetPasswordForm">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="6"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="6"
                required
            >

            <button
                type="submit"
                class="create-account-btn"
            >
                Reset Password
            </button>

        </form>

        <p
            id="message"
            style="
                margin-top: 15px;
                text-align: center;
            "
        ></p>

    </div>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const form =
            document.getElementById(
                "resetPasswordForm"
            );

        const message =
            document.getElementById(
                "message"
            );


        // Get reset token from URL
        const params =
            new URLSearchParams(
                window.location.search
            );

        const token =
            params.get("token");


        if (!token) {

            message.textContent =
                "Invalid or missing reset link.";

            form.style.display = "none";

            return;
        }


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const newPassword =
                    document
                        .getElementById(
                            "newPassword"
                        )
                        .value;

                const confirmPassword =
                    document
                        .getElementById(
                            "confirmPassword"
                        )
                        .value;


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    return;
                }


                if (
                    newPassword.length < 6
                ) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    return;
                }


                message.textContent =
                    "Resetting password...";


                try {

                    const response =
                        await fetch(
                            "/api/reset-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    token:
                                        token,

                                    newPassword:
                                        newPassword
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message ||
                            "Unable to reset password.";

                        return;
                    }


                    message.textContent =
                        data.message ||
                        "Password reset successfully!";


                    form.reset();


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        2000
                    );


                } catch (error) {

                    console.error(
                        "Reset password error:",
                        error
                    );

                    message.textContent =
                        "Server se connection nahi ho pa raha.";
                }

            }
        );


        // Apply saved dark mode
        if (
            localStorage.getItem(
                "connectHubDarkMode"
            ) === "true"
        ) {

            document.body.classList.add(
                "dark-mode"
            );
        }

    }
);

</script>

</body>
</html>
